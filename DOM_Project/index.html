<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Oma tehtävälista aamun ja päivän tehtävien hallintaan."
    />
    <title>Ennen koulua – tehtävälista</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="board">
      <section class="todo-card" aria-labelledby="page-title">
        <div class="tape" aria-hidden="true"></div>

        <header class="card-header">
          <p class="eyebrow">UUSI PÄIVÄ, UUSI ALKU</p>
          <h1 id="page-title">Ennen koulua</h1>
          <p class="subtitle">Pienet askeleet, hyvä päivä.</p>
        </header>

        <p id="task-counter" class="task-counter" aria-live="polite">
          Ei tehtäviä vielä. Aloitetaan!
        </p>

        <form id="todo-form" novalidate>
          <label for="task-input">Mitä pitää muistaa?</label>

          <div class="input-row">
            <input
              type="text"
              id="task-input"
              name="task"
              placeholder="Kirjoita tehtävä..."
              maxlength="100"
              autocomplete="off"
              aria-describedby="error-message"
            />
            <button type="submit" class="add-button">
              <span aria-hidden="true">+</span> Lisää
            </button>
          </div>

          <p id="error-message" class="error-message" role="alert"></p>
        </form>

        <section class="task-section" aria-label="Tehtävät">
          <ul id="task-list" class="task-list"></ul>

          <p id="empty-message" class="empty-message">
            Ei tehtäviä näytettävänä.
          </p>
        </section>

        <nav class="filters" aria-label="Tehtävien suodatus">
          <button
            type="button"
            class="filter-button active"
            data-filter="all"
            aria-pressed="true"
          >
            Kaikki
          </button>
          <button
            type="button"
            class="filter-button"
            data-filter="active"
            aria-pressed="false"
          >
            Kesken
          </button>
          <button
            type="button"
            class="filter-button"
            data-filter="completed"
            aria-pressed="false"
          >
            Tehdyt
          </button>
        </nav>

        <footer class="card-footer">
          <span>Yksi tehtävä kerrallaan ♡</span>
          <button type="button" id="clear-completed" class="clear-button">
            Poista tehdyt
          </button>
        </footer>
      </section>

      <p class="board-caption">SUUNNITTELE · TEE · ONNISTU</p>
    </main>
  </body>
</html>
