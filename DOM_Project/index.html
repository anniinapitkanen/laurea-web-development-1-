<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BeforeSchool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Lora:wght@600&family=Chango&family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1 class="app__title">Before school To-Do List</h1>

    <div class="toolbar">
      <p class="counter">Only 1 task left!</p>
      <input class="new-task" type="text" placeholder="Add an task" aria-label="Add a task">
    </div>

    <ul class="task-list">
      <li class="task">
        <input class="task__check" type="checkbox" aria-label="Eat breakfast">
        <span class="task__text">Eat breakfast</span>
        <button class="task__delete" aria-label="Delete task"></button>
      </li>
      <li class="task">
        <input class="task__check" type="checkbox" checked aria-label="Go to shower">
        <span class="task__text">Go to shower</span>
        <button class="task__delete" aria-label="Delete task"></button>
      </li>
      <li class="task">
        <input class="task__check" type="checkbox" checked aria-label="Brush teeth">
        <span class="task__text">Brush teeth</span>
        <button class="task__delete" aria-label="Delete task"></button>
      </li>
    </ul>

    <div class="filters">
      <button class="filter">All</button>
      <button class="filter">Active</button>
      <button class="filter">Completed</button>
    </div>
  </main>
</body>
</html>
